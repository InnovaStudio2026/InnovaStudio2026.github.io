<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="img/icono.png">
    <title>Sociales</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: url('img/fondo1.jpg') center no-repeat fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .overlay {
            background-color: rgba(0, 0, 0, 0.5);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Cabecera */
        .header-contenedor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            animation: aparecer 1.5s ease;
        }

        .grado-label {
            font-size: 140px;
            font-weight: 800;
            color: #3685ee;
            text-shadow: 0 0 15px rgba(14, 69, 187, 0.8);
            margin-bottom: 15px;
            line-height: 1;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: 30px;
        }

        header img {
            width: 140px;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px #f1f51493);
        }

        .titulo-principal h1 {
            font-size: 42px;
            margin: 8px 0;
            color: #021227;
            text-shadow: 0 0 12px #0846b8;
            animation: brillar 2.5s infinite alternate;
        }

        .titulo-principal h2 {
            font-size: 26px;
            margin: 6px 0;
            color: #a0d0f0;
            text-shadow: 0 0 8px #05174b;
        }

        .titulo-principal h3 {
            font-size: 22px;
            margin: 4px 0;
            color: #d0ffd0;
            opacity: 0.9;
        }

        /* Botones */
        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 50px 0;
            gap: 20px;
        }

        .boton-menu {
            padding: 18px 40px;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #008037, #00c853);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 260px;
            box-shadow: 0 6px 12px rgba(0, 255, 100, 0.3);
        }

        .boton-menu:hover {
            background: linear-gradient(135deg, #00c853, #1a77f0);
            transform: scale(1.07);
            box-shadow: 0 0 20px #1a77f0;
        }

        .boton-menu.blocked {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Tarjeta giratoria */
        .flip-card {
            background-color: transparent;
            width: 260px;
            height: 70px;
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #00bfa5, #00e676);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .flip-card-back {
            background: #00c853;
            color: white;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 10px;
        }

        .flip-card-back input {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            width: 120px;
            outline: none;
        }

        .flip-card-back button {
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 6px;
            background-color: #007a3d;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .flip-card-back button:hover {
            background-color: #00c853;
            box-shadow: 0 0 12px #1a77f0;
        }

        /* Footer */
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 18px;
            font-size: 0.9em;
            color: #f5f5f5;
            background-color: rgba(0, 0, 0, 0.5);
            font-family: 'Lucida Calligraphy', cursive;
            font-weight: bold;
            font-style: italic;
        }

        /* Botón volver */
        #btn-volver {
            position: fixed;
            bottom: 60px;
            left: 20px;
            z-index: 1000;
            padding: 12px 28px;
            background: linear-gradient(135deg, #006400, #00b300);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 255, 100, 0.3);
            transition: all 0.3s;
        }

        #btn-volver:hover {
            transform: scale(1.1);
            background: linear-gradient(135deg, #00b300, #1a77f0);
            box-shadow: 0 0 20px #1a77f0;
        }

        /* Animaciones */
        @keyframes brillar {
            from { text-shadow: 0 0 10px #00ff99; }
            to { text-shadow: 0 0 25px #1a77f0; }
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Anuncio Guía Historia - BLOQUEO */
        #anuncioActualizacion {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #anuncioActualizacion .contenido {
            background: linear-gradient(to bottom right, #ffdddd, #ffaaaa);
            color: #880000;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
            max-width: 80%;
        }

        #anuncioActualizacion button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
        }

        #anuncioActualizacion button:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #cc0000, #ff5555);
            box-shadow: 0 0 15px #ff0000;
        }

        @media (max-width: 500px) {
            .grado-label { font-size: 90px; }
            .titulo-principal h1 { font-size: 30px; }
            .boton-menu { width: 80%; font-size: 17px; }
            #btn-volver { font-size: 13px; padding: 10px 22px; }
        }

        /* Estilos para el Anuncio de Video */
        #videoAnuncio {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            align-items: center;
            justify-content: center;
        }

        #videoAnuncio > div {
            background: linear-gradient(to bottom right, #528fc4, #ffffff);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            max-width: 90%;
            text-align: center;
        }

        #anuncioVideo {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
        }

        #videoAnuncio button {
            padding: 10px 22px;
            font-size: 18px;
            background: linear-gradient(to bottom right, #0b6e2c, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        #videoAnuncio button:hover {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Estado bloqueado visual */
        .blocked-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <header>
            <div class="header-contenedor">
                <img src="img/icono.png" alt="Escudo del colegio" />
                <div class="grado-label">6°</div>
            </div>
            <div class="titulo-principal">
                <h1>Colegio Integrado Lucas Caballero</h1>
                <h2>Área de Sociales & Historia</h2>
                <h3>Docente: Marta Emilia Ovalle</h3>
            </div>
        </header>

        <section class="menu" id="menuContainer">
            <!-- Los botones se generarán dinámicamente con JS -->
        </section>

        <button id="btn-volver" onclick="location.href='menu.html'">⮜ Volver</button>

        <div id="videoAnuncio">
            <div style="max-width: 680px;">
                <video id="anuncioVideo" width="640" controls style="max-width: 100%; border-radius: 12px; box-shadow: 0 0 12px rgba(0,0,0,0.2);">
                    <source src="video/anuncio.mp4" type="video/mp4">
                    Tu navegador no admite el video.
                </video>
                <div style="margin-top: 15px; display: flex; justify-content: center; gap: 20px;">
                    <button onclick="iniciarReproduccionManual()">Reproducir Anuncio</button> 
                    <button onclick="cerrarAnuncio()">Volver</button>
                    <button onclick="saltarAnuncio()">Saltar</button>
                </div>
            </div>
        </div>

        <div id="anuncioActualizacion">
            <div class="contenido">
                <h2>⚠️ Guía de Historia Bloqueada ⚠️</h2>
                <p id="motivoBloqueo">Este modulo está siendo ajustado y validado.</p>
                <p>El acceso se encuentra inhabilitado temporalmente.</p>
                <button onclick="cerrarAnuncioActualizacion()">Entendido, Cerrar</button>
            </div>
        </div>

        <footer>
            © 2025 Institución Educativa Colucas - Derechos Reservados
        </footer>
    </div>

    <script>
        // ================================
        // 🔑 INTEGRACIÓN CON PANEL DE CONTROL
        // ================================
        const PLATFORM_CONFIG_KEY = 'innovastudio2026_sociales_config';

        // Cargar configuración centralizada
        function loadPlatformConfig() {
            const saved = localStorage.getItem(PLATFORM_CONFIG_KEY);
            const defaultConfig = {
                guiaHistoria: { enabled: false, reason: "Este módulo está siendo ajustado y validado." },
                quizConocimiento: { enabled: true, password: "social2025" },
                bibliotecaDigital: { enabled: true, adRequired: true },
                guiaSociales: { enabled: true },
                autoevaluacion: { enabled: true },
                herramientas: { enabled: true }
            };
            
            return saved ? JSON.parse(saved) : defaultConfig;
        }

        // Estado global
        let config = loadPlatformConfig();

        // ================================
        // FUNCIONES DE PROGRESO (sin cambios)
        // ================================
        const AREA_NAME = "Historia y Sociales";
        const PROGRESO_KEY = `progreso_${AREA_NAME.replace(/\s/g, '_')}`;

        function obtenerProgreso() {
            return parseInt(localStorage.getItem(PROGRESO_KEY)) || 0;
        }

        function guardarProgreso(progreso) {
            localStorage.setItem(PROGRESO_KEY, progreso);
        }

        function incrementarProgreso(incremento) {
            let progresoActual = obtenerProgreso();
            if (progresoActual >= 100) return;
            progresoActual = Math.min(100, progresoActual + incremento);
            guardarProgreso(progresoActual);
            console.log(`Progreso actualizado en ${AREA_NAME}: ${progresoActual}%`);
        }
        
        function incrementarProgresoYRedirigir(url, incremento) {
            incrementarProgreso(incremento);
            window.location.href = url;
        }

        // ================================
        // RENDERIZADO DINÁMICO DE BOTONES
        // ================================
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            // Guía Sociales
            if (config.guiaSociales.enabled) {
                const btn = document.createElement('button');
                btn.className = 'boton-menu';
                btn.textContent = 'Guía Sociales';
                btn.onclick = () => incrementarProgresoYRedirigir('guia/guia-boseto.html', 6);
                container.appendChild(btn);
            }

            // Guía Historia
            const historiaBtn = document.createElement('button');
            if (config.guiaHistoria.enabled) {
                historiaBtn.className = 'boton-menu';
                historiaBtn.textContent = 'Guía Historia';
                historiaBtn.onclick = () => window.location.href = 'historia.html';
            } else {
                historiaBtn.className = 'boton-menu blocked';
                historiaBtn.textContent = 'Guía Historia';
                historiaBtn.title = 'Bloqueado por administración';
                historiaBtn.onclick = mostrarAnuncioActualizacion;
            }
            container.appendChild(historiaBtn);

            // Autoevaluación
            if (config.autoevaluacion.enabled) {
                const btn = document.createElement('button');
                btn.className = 'boton-menu';
                btn.textContent = 'Autoevaluación';
                btn.onclick = () => incrementarProgresoYRedirigir('autoevaluacion.html', 6);
                container.appendChild(btn);
            }

            // Qüizz de Conocimiento
            const flipCard = document.createElement('div');
            flipCard.className = 'flip-card';
            if (config.quizConocimiento.enabled) {
                flipCard.onclick = (e) => toggleFlip(e);
            } else {
                flipCard.style.opacity = '0.5';
                flipCard.style.pointerEvents = 'none';
                flipCard.title = 'Bloqueado por administración';
                // Añadir overlay visual
                const overlay = document.createElement('div');
                overlay.className = 'blocked-overlay';
                overlay.innerHTML = '<i class="fas fa-lock"></i><br>Bloqueado';
                flipCard.appendChild(overlay);
            }
            
            flipCard.innerHTML += `
                <div class="flip-card-inner" id="flipInner">
                    <div class="flip-card-front">
                        Qüizz de Conocimiento
                    </div>
                    <div class="flip-card-back">
                        <input type="password" id="password" placeholder="Contraseña">
                        <button onclick="checkPassword(event)">Ingresar</button>
                    </div>
                </div>
            `;
            container.appendChild(flipCard);

            // Biblioteca Digital
            const bibliotecaBtn = document.createElement('button');
            if (config.bibliotecaDigital.enabled) {
                bibliotecaBtn.className = 'boton-menu';
                bibliotecaBtn.textContent = 'Biblioteca digital📚';
                bibliotecaBtn.onclick = () => abrirAnuncioVideo(2);
            } else {
                bibliotecaBtn.className = 'boton-menu blocked';
                bibliotecaBtn.textContent = 'Biblioteca digital📚';
                bibliotecaBtn.title = 'Bloqueado por administración';
                bibliotecaBtn.onclick = () => alert('Este módulo está desactivado temporalmente.');
            }
            container.appendChild(bibliotecaBtn);

            // Herramientas
            if (config.herramientas.enabled) {
                const btn = document.createElement('button');
                btn.className = 'boton-menu';
                btn.textContent = 'Herramientas';
                btn.onclick = () => incrementarProgresoYRedirigir('herramientas/index.html', 4);
                container.appendChild(btn);
            }
        }

        // ================================
        // LÓGICA ACTUALIZADA (con integración)
        // ================================
        function toggleFlip(e) {
            if (!config.quizConocimiento.enabled) return;
            const inner = e.currentTarget.querySelector('.flip-card-inner');
            if (inner.classList.contains('flipped')) return; 
            inner.classList.add('flipped');

            clearTimeout(window.flipTimeout);
            window.flipTimeout = setTimeout(() => {
                inner.classList.remove('flipped');
                document.getElementById("password").value = "";
            }, 180000);
        }

        function checkPassword(e) {
            if (!config.quizConocimiento.enabled) return;
            e.stopPropagation(); 
            const input = document.getElementById("password").value;
            if (input === config.quizConocimiento.password) {
                clearTimeout(window.flipTimeout);
                incrementarProgreso(4); 
                window.location.href = "ptt2025.html";
            } else {
                alert("Contraseña incorrecta");
                document.getElementById("flipInner").classList.remove('flipped'); 
                document.getElementById("password").value = "";
            }
        }

        function abrirAnuncioVideo(incremento) {
            if (!config.bibliotecaDigital.enabled) return;
            
            const anuncio = document.getElementById("videoAnuncio");
            const video = document.getElementById("anuncioVideo");
            video.pause();
            video.currentTime = 0; 
            video.onended = null; 
            anuncio.style.display = "flex";
            
            // Si el anuncio NO es obligatorio, permitir saltar sin ver
            if (!config.bibliotecaDigital.adRequired) {
                video.onended = null;
                return;
            }
            
            video.onended = function () {
                incrementarProgreso(incremento); 
                window.open("https://www.ellibrototal.com/ltotal/", "_blank");
                anuncio.style.display = "none";
            };
        }

        function iniciarReproduccionManual() {
            if (!config.bibliotecaDigital.enabled) return;
            const video = document.getElementById("anuncioVideo");
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => console.error("Error al reproducir:", error));
            }
        }

        function cerrarAnuncio() {
            const anuncio = document.getElementById("videoAnuncio");
            const video = document.getElementById("anuncioVideo");
            video.pause();
            anuncio.style.display = "none";
        }

        function saltarAnuncio() {
            if (!config.bibliotecaDigital.enabled) return;
            const anuncio = document.getElementById("videoAnuncio");
            const video = document.getElementById("anuncioVideo");
            video.pause();
            anuncio.style.display = "none";
            incrementarProgreso(2); 
            window.open("https://www.ellibrototal.com/ltotal/", "_blank");
        }

        function mostrarAnuncioActualizacion() {
            if (config.guiaHistoria.enabled) {
                window.location.href = 'historia.html';
                return;
            }
            document.getElementById("motivoBloqueo").textContent = 
                config.guiaHistoria.reason || "Este módulo está siendo ajustado y validado.";
            document.getElementById("anuncioActualizacion").style.display = "flex";
        }

        function cerrarAnuncioActualizacion() {
            document.getElementById("anuncioActualizacion").style.display = "none";
        }

        // ================================
        // INICIALIZACIÓN
        // ================================
        document.addEventListener('DOMContentLoaded', function() {
            renderMenu();
            
            // Escuchar cambios en localStorage (para múltiples pestañas)
            window.addEventListener('storage', function(e) {
                if (e.key === PLATFORM_CONFIG_KEY) {
                    config = loadPlatformConfig();
                    renderMenu();
                }
            });
        });

        // Font Awesome para íconos (requerido por el overlay)
        document.addEventListener('DOMContentLoaded', () => {
            const script = document.createElement('script');
            script.src = 'https://kit.fontawesome.com/a076d05399.js';
            script.crossorigin = 'anonymous';
            document.head.appendChild(script);
        });
    </script>
</body>
</html>
